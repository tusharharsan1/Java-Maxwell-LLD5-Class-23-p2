spring.application.name=payout-guard

# The database is H2, and it lives in memory: it starts empty each time the application starts.
# Hibernate makes the table from the Payout class.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# A refused request shows a clear reason (a ProblemDetail).
spring.mvc.problemdetails.enabled=true
